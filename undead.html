 {id:'forest',n:'Dark Forest',d:'Dense trees. Easy to get cornered.',gm:1.2,gen:genForest,th:{floor:'#101d14',out:'#060d08',grid:'rgba(100,180,120,.06)',wall:'#1f4a2a',ws:'#3f8a50',border:'#2a6a3a',dec:['#16301c','#1b3a22','#0f2a18']}},
 {id:'fort',n:'Fortress',d:'A walled compound with four gates.',gm:1,gen:genFort,th:{floor:'#1c1a20',out:'#0b0a0d',grid:'rgba(160,150,200,.07)',wall:'#3a3646',ws:'#8a85a8',border:'#6a2a55',dec:['#26232c','#2b2733','#201e26']}}];

/* ----- hazards ----- */
function placeHazards(b,bd,n){
  let tries=0;
  while(n>0&&tries++<n*40){
    const k=pick2(HZK[b]), x=bd.x+60+Math.random()*(bd.w-120), y=bd.y+60+Math.random()*(bd.h-120), r=k==='acid'?rr(44,76):k==='mud'?rr(55,90):({mine:22,vent:30,trap:18})[k];
    if(inWall(x,y,r+14)||Math.hypot(x-WW/2,y-WH/2)<260||posts.some(o=>Math.hypot(o.x-x,o.y-y)<280)||lairs.some(l=>Math.hypot(l.x-x,l.y-y)<480)||hz.some(h=>Math.hypot(h.x-x,h.y-y)<h.r+r+30)) continue;

function dotP(d){ if(st!=='play'||p.dash>0) return; p.hp-=d; p.hit=3; flashR=Math.max(flashR,3); if(p.hp<=0){ p.hp=1; p.inv=0; hurtP(999); } }
function hazardTick(){
  p.sf=1; enemies.forEach(e=>{ e.sf=1; });
  for(const h of hz){
    if(h.dead||Math.abs(h.x-p.x)>1100||Math.abs(h.y-p.y)>1100) continue; h.t++;
    const R=h.r, near=Math.hypot(p.x-h.x,p.y-h.y)<R+(h.k==='acid'||h.k==='mud'?0:p.r*.5);
    if(h.k==='acid'){ if(near){ p.sf=Math.min(p.sf,.75); if(h.t%12===0) dotP(1); }
      enemies.forEach(e=>{ if(!e.dead&&Math.hypot(e.x-h.x,e.y-h.y)<R){ e.sf=Math.min(e.sf,.8); if(h.t%12===0) hitE(e,1.5,null); } }); }
    else if(h.k==='mud'){ if(near) p.sf=Math.min(p.sf,.5); enemies.forEach(e=>{ if(!e.dead&&Math.hypot(e.x-h.x,e.y-h.y)<R) e.sf=Math.min(e.sf,.5); }); }
    else if(h.k==='vent'){ if((h.t+h.ph)%240<80){ if(near&&h.t%20===0) hurtP(8);
      enemies.forEach(e=>{ if(!e.dead&&Math.hypot(e.x-h.x,e.y-h.y)<R+6&&h.t%20===0){ hitE(e,6,null); e.burn=60; } }); } }
    else if(h.k==='mine'){
      let hit=near&&p.dash<=0; if(!hit) hit=enemies.some(e=>!e.dead&&Math.hypot(e.x-h.x,e.y-h.y)<R);
      if(hit){ h.dead=true; shake=Math.max(shake,12); snd(80,.35,'sawtooth',.1); blood(h.x,h.y,'#ff9d3c',30,6); blood(h.x,h.y,'#555',14,3); const MR=80, dp=Math.hypot(p.x-h.x,p.y-h.y);
        if(dp<MR) hurtP(Math.round(42*(1-.6*dp/MR)));
        enemies.forEach(e=>{ const d=Math.hypot(e.x-h.x,e.y-h.y); if(d<MR+e.r&&!e.dead) hitE(e,70*(1-.6*d/(MR+e.r)),null); }); } }
    else if(h.k==='trap'){
      if(h.sprung){ if(--h.re<=0) h.sprung=false; }
      else { const ez=enemies.find(e=>!e.dead&&Math.hypot(e.x-h.x,e.y-h.y)<R+e.r*.4), pp=near&&p.dash<=0;
        if(pp||ez){ h.sprung=true; h.re=700; snd(250,.12,'square',.07); blood(h.x,h.y,'#bbb',8,3); if(pp){ p.root=80; dotP(10); } if(ez){ ez.root=90; hitE(ez,12,null); } } } }
  }
}
function drawHazards(){
  const t=performance.now();
  hz.forEach(h=>{
    if(h.dead||!vis(h.x,h.y,h.r+30)) return;
    if(h.k==='acid'){ ctx.fillStyle='rgba(90,220,70,.28)'; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,7); ctx.fill(); ctx.strokeStyle='rgba(150,255,110,.6)'; ctx.lineWidth=2; ctx.stroke();
      for(let i=0;i<4;i++){ const a=i*1.7+t/900, rr2=h.r*.6*((Math.sin(t/400+i)+1)/2); ctx.fillStyle='rgba(190,255,150,.5)'; ctx.beginPath(); ctx.arc(h.x+Math.cos(a)*rr2,h.y+Math.sin(a)*rr2,3,0,7); ctx.fill(); } }
    else if(h.k==='mud'){ ctx.fillStyle='rgba(90,60,30,.55)'; ctx.beginPath(); ctx.ellipse(h.x,h.y,h.r,h.r*.7,0,0,7); ctx.fill(); ctx.strokeStyle='rgba(60,40,20,.8)'; ctx.lineWidth=2; ctx.stroke(); }
    else if(h.k==='mine'){ ctx.fillStyle='#2a2428'; ctx.beginPath(); ctx.arc(h.x,h.y,9,0,7); ctx.fill(); ctx.fillStyle=Math.floor(t/400+h.ph)%2?'#ff3b3b':'#551111'; ctx.beginPath(); ctx.arc(h.x,h.y,3,0,7); ctx.fill(); }
    else if(h.k==='vent'){ const ph=(h.t+h.ph)%240; ctx.fillStyle='#2b2220'; ctx.beginPath(); ctx.arc(h.x,h.y,12,0,7); ctx.fill();
      if(ph>=200){ ctx.strokeStyle='rgba(255,170,60,'+(.3+.4*Math.sin(t/60))+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,7); ctx.stroke(); }
      if(ph<80){ const g2=ctx.createRadialGradient(h.x,h.y,4,h.x,h.y,h.r+8); g2.addColorStop(0,'rgba(255,230,120,.95)'); g2.addColorStop(1,'rgba(255,90,20,.15)'); ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(h.x,h.y,h.r+8,0,7); ctx.fill(); } }
    else if(h.k==='trap'){ ctx.strokeStyle=h.sprung?'#555':'#b9b9c9'; ctx.lineWidth=2.5; ctx.beginPath(); for(let i=0;i<8;i++){ const a=i/8*6.283; ctx.moveTo(h.x+Math.cos(a)*5,h.y+Math.sin(a)*5); ctx.lineTo(h.x+Math.cos(a)*(h.sprung?9:16),h.y+Math.sin(a)*(h.sprung?9:16)); } ctx.stroke(); ctx.beginPath(); ctx.arc(h.x,h.y,5,0,7); ctx.stroke(); }
  });
}

  return o.filter(r=>r.x>=0&&r.y>=0&&r.x+r.w<=rw&&r.y+r.h<=rh).map(r=>({...r,x:r.x+ox,y:r.y+oy,b}));
}
function initOpen(){
  walls=[]; decals=[]; const cols=4, rows=3, rw=WW/cols, rh=WH/rows, bio=[];
  for(let i=0;i<cols*rows;i++) bio.push(Math.floor(Math.random()*5)); bio[5]=0; bio[6]=1;

  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const b=bio[r*cols+c], ox=c*rw, oy=r*rh; regions.push({b,x:ox,y:oy,w:rw,h:rh});
    genRegionWalls(b,ox,oy,rw,rh).forEach(w=>walls.push(w));
    for(let i=0;i<70;i++) decals.push({x:ox+Math.random()*rw,y:oy+Math.random()*rh,t:Math.floor(Math.random()*3),s:2+Math.random()*4,b}); }
  walls=clearSpawn(walls);
  posts=[{x:WW/2,y:WH/2-120,found:true,t:0}]; lastPost=posts[0]; let tries=0;
  while(posts.length<7&&tries++<800){ const x=rr(200,WW-200), y=rr(200,WH-200); if(inWall(x,y,60)||posts.some(o=>Math.hypot(o.x-x,o.y-y)<1100)) continue; posts.push({x,y,found:false,t:0}); }

    if(!c.open&&c.tier===2){ ctx.shadowColor='#ffd24d'; ctx.shadowBlur=16+Math.sin(performance.now()/200)*6; }
    ctx.globalAlpha=c.open?Math.max(.2,1-c.age/500):1; ctx.fillStyle=col; ctx.strokeStyle='#2a1a0c'; ctx.lineWidth=2;
    ctx.fillRect(-14,-6,28,16); ctx.strokeRect(-14,-6,28,16);
    if(c.open){ ctx.fillStyle='#1c1208'; ctx.fillRect(-12,-4,24,6); ctx.fillStyle=col; ctx.fillRect(-14,-18,28,8); ctx.strokeRect(-14,-18,28,8); }
    else { ctx.fillRect(-14,-14,28,10); ctx.strokeRect(-14,-14,28,10); ctx.fillStyle='#2a1a0c'; ctx.fillRect(-3,-6,6,7); }
    ctx.restore(); });
  drops.forEach(d=>{ if(!vis(d.x,d.y)) return; const c=d.k==='hp'?'#ff5a6e':d.k==='gren'?'#8fda6a':WP[d.k].col, r=9+Math.sin(performance.now()/150)*1.5; ctx.save(); ctx.shadowColor=c; ctx.shadowBlur=12; ctx.fillStyle=c; ctx.globalAlpha=d.life<120&&d.life%10<5?.3:1;
    ctx.beginPath(); ctx.arc(d.x,d.y,r,0,7); ctx.fill(); ctx.restore(); tx({hp:'+',gren:'\u25cf',smg:'M',shotgun:'S',rifle:'R',crossbow:'X',flame:'F',minigun:'G',rocket:'L',arc:'A'}[d.k],d.x,d.y+4,11,'#111'); });
  coins.forEach(c=>{ if(!vis(c.x,c.y)) return; const w=Math.abs(Math.sin(performance.now()/160+c.x))*5+1; ctx.fillStyle='#ffd24d'; ctx.strokeStyle='#a87a10'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(c.x,c.y,w,6,0,0,7); ctx.fill(); ctx.stroke(); });
  gs.forEach(g=>{ const k=g.t/g.T, h=Math.sin(k*Math.PI)*40; ctx.fillStyle='#0006'; ctx.beginPath(); ctx.ellipse(g.x,g.y,6,3,0,0,7); ctx.fill(); ctx.fillStyle='#8fda6a'; ctx.beginPath(); ctx.arc(g.x,g.y-h,6,0,7); ctx.fill(); });
  enemies.forEach(e=>{ if(!vis(e.x,e.y,50)) return; ctx.save(); ctx.translate(e.x,e.y); ctx.fillStyle=e.flash?'#fff':e.c; ctx.strokeStyle='#0008'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.fill(); ctx.stroke();
    ctx.rotate(e.a); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(e.r*.45,-e.r*.35,e.r*.2,0,7); ctx.arc(e.r*.45,e.r*.35,e.r*.2,0,7); ctx.fill(); ctx.restore();
    if(e.max>100){ ctx.fillStyle='#000a'; ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4); ctx.fillStyle='#ff5a6e'; ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.max),4); } if(e.bn) tx(e.bn,e.x,e.y-e.r-14,12,'#ffb36b'); });
  eb.forEach(b=>{ ctx.save(); ctx.shadowColor='#b7f'; ctx.shadowBlur=8; ctx.fillStyle='#c9a0ff'; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill(); ctx.restore(); });
  bullets.forEach(b=>{ ctx.strokeStyle=b.col; ctx.lineWidth=b.big?6:3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*.9,b.y-b.vy*.9); ctx.stroke(); });
  arcs.forEach(a=>{ ctx.save(); ctx.strokeStyle='#bfe9ff'; ctx.shadowColor='#7ad7ff'; ctx.shadowBlur=12; ctx.lineWidth=2.5; ctx.beginPath(); a.pts.forEach((q,i)=>{ const jx=i?(Math.random()-.5)*10:0, jy=i?(Math.random()-.5)*10:0; if(i) ctx.lineTo(q.x+jx,q.y+jy); else ctx.moveTo(q.x,q.y); }); ctx.stroke(); ctx.restore(); });
  parts.forEach(q=>{ ctx.globalAlpha=Math.min(1,q.life/18); ctx.fillStyle=q.c; ctx.fillRect(q.x-1.5,q.y-1.5,3,3); }); ctx.globalAlpha=1;
  if(st!=='dead'){ ctx.save(); ctx.translate(p.x,p.y); if(p.inv>0&&p.dash<=0&&Math.floor(p.inv/4)%2) ctx.globalAlpha=.4;
    ctx.rotate(p.a); ctx.fillStyle='#5b6a80'; ctx.fillRect(6,-4,20,8); if(p.flash){ ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(30,0,8,0,7); ctx.fill(); }
    ctx.fillStyle=p.hit%4>1?'#fff':'#35d0ff'; ctx.strokeStyle='#07475a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); }
  texts.forEach(t=>{ ctx.globalAlpha=Math.min(1,t.life/20); tx(t.t,t.x,t.y,13,t.c||'#ffe27a'); }); ctx.globalAlpha=1;
  ctx.restore();
}
function minimap(){ if(mode==='open') return miniOpen();
  const mw=150, mh=100, x=W-mw-12, y=H-mh-12, k=mw/WW;
  ctx.fillStyle='rgba(8,5,16,.72)'; ctx.fillRect(x,y,mw,mh); ctx.strokeStyle='#5b4aa8'; ctx.lineWidth=1.5; ctx.strokeRect(x,y,mw,mh);
  ctx.fillStyle=MAPS[curMap].th.ws; walls.forEach(w=>ctx.fillRect(x+w.x*k,y+w.y*k,Math.max(1,w.w*k),Math.max(1,w.h*k)));
  chests.forEach(c=>{ if(c.open) return; ctx.fillStyle=['#c58a4f','#dfe7f5','#ffd24d'][c.tier]; ctx.fillRect(x+c.x*k-2,y+c.y*k-2,4,4); });
  enemies.forEach(e=>{ ctx.fillStyle=e.boss?'#ff3b6b':'#ff5a4a'; const s=e.boss?4:2; ctx.fillRect(x+e.x*k-s/2,y+e.y*k-s/2,s,s); });
  ctx.fillStyle='#35d0ff'; ctx.beginPath(); ctx.arc(x+p.x*k,y+p.y*k,3,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.strokeRect(x+camX*k,y+camY*k,W*k,H*k);
}
function hud(){
  ctx.fillStyle='#000a'; ctx.fillRect(14,14,204,16); ctx.fillStyle=p.hp/p.max>.3?'#ff4d5e':'#ff2a2a'; ctx.fillRect(16,16,200*Math.max(0,p.hp)/p.max,12); tx(Math.ceil(Math.max(0,p.hp))+' / '+p.max,116,27,11,'#fff');
  const w=WP[p.w]; tx(w.n+'  '+(p.w==='pistol'?'\u221e':p.ammo[p.w]),16,48,14,w.col,'left');
  tx('\ud83d\udca3 \u00d7'+p.gren,16,66,13,'#b9e8a0','left');
  ctx.fillStyle='#000a'; ctx.fillRect(16,72,80,6); ctx.fillStyle=p.dashCd>0?'#556':'#6cf'; ctx.fillRect(16,72,80*(1-Math.max(0,p.dashCd)/(95*mods.dashcd)),6); tx('DASH',104,79,10,'#9ab','left');
  tx(mode==='open'?'Day '+dayN:'Wave '+wave,W-16,26,18,'#fff','right'); tx(String(score),W-16,46,16,'#ffe27a','right'); tx('$ '+runGold+'  (bank '+SAVE.gold+')',W-16,64,13,'#ffd24d','right');
  if(combo>1) tx('COMBO \u00d7'+(1+Math.min(combo,20)*.1).toFixed(1),W-16,82,13,'#ff9d3c','right');
  if(bannerT>0&&st==='play'){ ctx.globalAlpha=Math.min(1,bannerT/30); ctx.save(); ctx.shadowColor='#000'; ctx.shadowBlur=10; tx(banner,W/2,H/2-80,44,'#fff'); ctx.restore(); ctx.globalAlpha=1; }
  if(mode==='wave'&&st==='play'&&!queue.length&&!enemies.length) tx('Wave cleared!',W/2,H/2-80,32,'#7dff9a');
  weaponBar(); if(mode==='open') hudOpen();
  minimap();
}
function drawPerk(){
  ctx.fillStyle='rgba(8,5,16,.82)'; ctx.fillRect(0,0,W,H); tx(mode==='open'?'BOSS LAIR CLEARED':'WAVE '+wave+' CLEARED',W/2,70,34,'#7dff9a'); tx('Choose an upgrade',W/2,102,17,'#cfc9ff');
  perkOpts.forEach((o,i)=>{ const x=60+i*240; ctx.fillStyle='#1d1638'; ctx.fillRect(x,140,220,190); ctx.strokeStyle='#6a5aa8'; ctx.lineWidth=2; ctx.strokeRect(x,140,220,190);
    tx(String(i+1),x+110,185,40,'#ffb347'); tx(o.n,x+110,225,19,'#fff'); wrap(o.d,x+110,255,190,15,'#cfc9ff'); zone(x,140,220,190,()=>pickPerk(i)); });

function drawStore(){
  ctx.fillStyle='rgba(8,5,16,.9)'; ctx.fillRect(0,0,W,H);
  button('\u25c0 Back',14,12,100,34,()=>{ st=backTo; });
  tx('STORE',W/2,40,32,'#fff'); button('Upgrades',230,50,160,30,()=>{ storeTab=0; },storeTab===0?'#ffd24d':'#6a5aa8'); button('Weapons',410,50,160,30,()=>{ storeTab=1; },storeTab===1?'#ffd24d':'#6a5aa8'); tx('$ '+SAVE.gold,W-20,38,24,'#ffd24d','right');
  ITEMS.filter(it=>!!it.wp===!!storeTab).forEach((it,i)=>{ const x=14+(i%2)*396, y=88+((i/2)|0)*76, l=lvl(it), mx=l>=it.max, c=cost(it), can=SAVE.gold>=c;
    ctx.fillStyle='#1d1638'; ctx.fillRect(x,y,382,68); ctx.strokeStyle=mx?'#4a8f5a':can?'#8a7ad8':'#4a3d85'; ctx.lineWidth=2; ctx.strokeRect(x,y,382,68);
    tx(it.n,x+12,y+24,17,'#fff','left'); tx(it.d,x+12,y+44,12,'#a89bd6','left');
    if(it.max>1){ for(let k=0;k<it.max;k++){ ctx.fillStyle=k<l?'#ffb347':'#352a60'; ctx.fillRect(x+12+k*14,y+52,10,7); } }
    tx(mx?(it.wp?'OWNED':'MAX'):'$ '+c,x+368,y+30,18,mx?'#7dff9a':can?'#ffd24d':'#ff7a7a','right');
    if(!mx) tx('tap to buy',x+368,y+50,11,'#8f86c9','right'); zone(x,y,382,68,()=>buy(it)); });
  if(storeMsgT>0) tx(storeMsg,W/2,H-8,15,'#ffe27a');
}
function drawMaps(){
  ctx.fillStyle='#15121f'; ctx.fillRect(0,0,W,H);
  button('\u25c0 Back',14,12,100,34,()=>{ st='menu'; });
  tx('SELECT MAP',W/2,40,32,'#fff'); tx('Used by Wave Siege \u00b7 Open World contains every biome',W/2,57,11,'#a89bd6');
  MAPS.forEach((m,i)=>{ const x=i<3?20+i*260:150+(i-3)*260, y=i<3?62:262, w=240, h=186, on=curMap===i;
    ctx.fillStyle='#1d1638'; ctx.fillRect(x,y,w,h); ctx.strokeStyle=on?'#ffd24d':'#4a3d85'; ctx.lineWidth=on?3:2; ctx.strokeRect(x,y,w,h);
    const px=x+8, py=y+8, pw=w-16, ph=96, kx=pw/2400, ky=ph/1600; ctx.fillStyle=m.th.floor; ctx.fillRect(px,py,pw,ph);
    ctx.fillStyle=m.th.ws; prevWalls(i).forEach(b=>ctx.fillRect(px+b.x*kx,py+b.y*ky,Math.max(1.5,b.w*kx),Math.max(1.5,b.h*ky)));
    tx(m.n+(on?'  \u2713':''),x+w/2,y+126,17,'#fff'); wrap(m.d,x+w/2,y+145,w-24,11,'#a89bd6');
    tx('Gold \u00d7'+m.gm.toFixed(2).replace(/0$/,'')+'  \u00b7  Best: '+(SAVE.mbest[m.id]||0),x+w/2,y+h-8,11,'#ffd24d');
    zone(x,y,w,h,()=>{ curMap=i; SAVE.map=m.id; persist(); }); });
}
function _oldMenu(){
  ctx.fillStyle='#15121f'; ctx.fillRect(0,0,W,H); ctx.strokeStyle='rgba(120,100,200,.08)'; for(let x=0;x<=W;x+=80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); } for(let y=0;y<=H;y+=80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.save(); ctx.shadowColor='#f23'; ctx.shadowBlur=24; tx('UNDEAD SIEGE',W/2,120,66,'#ff4d5e'); ctx.restore();
  tx('A huge world. Endless waves. Hunt chests, collect gold, upgrade.',W/2,162,17,'#cfc9ff');
  button('\u25b6  PLAY',270,188,260,50,()=>reset(),'#ff4d5e'); button('\ud83d\uded2  STORE',270,246,260,50,()=>{ backTo='menu'; st='store'; },'#ffd24d'); button('\ud83d\uddfa  MAP: '+MAPS[curMap].n,270,304,260,50,()=>{ st='maps'; },'#6fcf4f');
  tx('Bank: $ '+SAVE.gold+'   \u00b7   Best score: '+SAVE.best,W/2,392,17,'#ffd24d');
  tx('WASD move \u00b7 mouse aim & shoot \u00b7 Space dash \u00b7 G grenade \u00b7 walk into chests',W/2,420,14,'#a89bd6');

function _oldDead(){
  ctx.fillStyle='rgba(30,0,8,.8)'; ctx.fillRect(0,0,W,H); ctx.save(); ctx.shadowColor='#f23'; ctx.shadowBlur=20; tx('YOU DIED',W/2,130,60,'#ff4d5e'); ctx.restore();
  tx('Reached wave '+wave+'  \u00b7  Score '+score,W/2,184,22,'#fff'); tx(score>=SAVE.best&&score>0?'\u2605 New best! \u2605':'Best: '+SAVE.best,W/2,214,17,'#ffe27a');
  tx('Gold earned this run: $ '+runGold,W/2,250,20,'#ffd24d'); tx('Bank: $ '+SAVE.gold,W/2,278,16,'#ffd24d');
  button('\u21bb  RETRY',270,310,260,48,()=>reset(),'#ff4d5e'); button('\ud83d\uded2  STORE',270,370,125,48,()=>{ backTo='dead'; st='store'; },'#ffd24d'); button('MENU',405,370,125,48,()=>{ st='menu'; });
}
function draw(){
  Z=[]; ctx.clearRect(0,0,W,H);
  if(st==='menu'){ drawMenu(); return; }
  if(st==='maps'){ drawMaps(); return; }
  if(st==='store'){ if(p&&backTo==='dead'){ drawWorld(); } else { ctx.fillStyle='#15121f'; ctx.fillRect(0,0,W,H); } drawStore(); return; }
  drawWorld();
  if(mode==='open') drawNight();
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(flashR>0){ ctx.fillStyle='rgba(255,40,60,'+flashR/24+')'; ctx.fillRect(0,0,W,H); }
  if(st==='play'&&!stick.r&&matchMedia&&!matchMedia('(pointer:coarse)').matches){ const x=M.sx, y=M.sy; ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.moveTo(x-13,y); ctx.lineTo(x-4,y); ctx.moveTo(x+4,y); ctx.lineTo(x+13,y); ctx.moveTo(x,y-13); ctx.lineTo(x,y-4); ctx.moveTo(x,y+4); ctx.lineTo(x,y+13); ctx.stroke(); }
  ['l','r'].forEach(s=>{ const k=stick[s]; if(!k) return; ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(k.ox,k.oy,50,0,7); ctx.stroke(); const v=sv(k); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(k.ox+v.x*50,k.oy+v.y*50,20,0,7); ctx.fill(); });
  hud();
  if(st==='perk') drawPerk();
  if(st==='dead') drawDead();
  if(bigMap&&mode==='open') drawBigMap();
  if(paused){ ctx.fillStyle='rgba(8,5,16,.7)'; ctx.fillRect(0,0,W,H); tx('PAUSED',W/2,H/2,48,'#fff'); }
}

let last=0, acc=0;
function loop(t){ const dt=Math.min(100,t-last); last=t; if(!paused&&!bigMap){ acc+=dt; while(acc>=16.667){ update(); acc-=16.667; } } draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

const cpos=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}; };
function ui(c){ for(let i=Z.length-1;i>=0;i--){ const z=Z[i]; if(c.x>=z.x&&c.x<=z.x+z.w&&c.y>=z.y&&c.y<=z.y+z.h){ z.fn(); return; } } }
cv.addEventListener('pointerdown',e=>{
  const c=cpos(e); if(st!=='play'){ ui(c); return; }
  if(e.pointerType==='mouse'){ M.sx=c.x; M.sy=c.y; if(e.button===2) throwG(); else M.down=true; }
  else { const s=c.x<W/2?'l':'r'; if(!stick[s]){ stick[s]={id:e.pointerId,ox:c.x,oy:c.y,x:c.x,y:c.y}; try{cv.setPointerCapture(e.pointerId);}catch(_){} } }
});
cv.addEventListener('pointermove',e=>{ const c=cpos(e); if(e.pointerType==='mouse'){ M.sx=c.x; M.sy=c.y; } else for(const s in stick) if(stick[s].id===e.pointerId){ stick[s].x=c.x; stick[s].y=c.y; } });
const up=e=>{ if(e.pointerType==='mouse') M.down=false; else for(const s in stick) if(stick[s].id===e.pointerId) delete stick[s]; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(!K[e.code]){
    if(st==='menu'||st==='dead'){ if(e.code==='Enter'||e.code==='Space') reset(); else if(st==='menu'&&e.code==='Digit1'){ mode='open'; SAVE.mode=mode; reset(); } else if(st==='menu'&&e.code==='Digit2'){ mode='wave'; SAVE.mode=mode; reset(); } else if(e.code==='KeyS'){ backTo=st; st='store'; } else if(e.code==='KeyM'&&st==='menu') st='maps'; }
    else if(st==='store'){ if(e.code==='Escape'||e.code==='Backspace') st=backTo; }
    else if(st==='maps'){ if(e.code==='Escape'||e.code==='Backspace') st='menu'; }
    else if(st==='play'){
      if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight') dash();
      if(e.code==='KeyG') throwG(); if(e.code==='KeyQ') cycle(); if(e.code==='KeyP') paused=!paused; if(e.code==='KeyM'&&mode==='open') bigMap=!bigMap;
      const n=['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9'].indexOf(e.code); if(n>=0&&(n===0||p.ammo[ORDER[n]]>0)) p.w=ORDER[n];
    } else if(st==='perk'){ const n=['Digit1','Digit2','Digit3'].indexOf(e.code); if(n>=0) pickPerk(n); }
  }
  K[e.code]=true;
});
addEventListener('keyup',e=>{K[e.code]=false;});
addEventListener('blur',()=>{for(const k in K)K[k]=false; M.down=false;});
addEventListener('beforeunload',persist); document.addEventListener('visibilitychange',()=>{ if(document.hidden) persist(); });
[['bDash',dash],['bGren',throwG],['bSwap',cycle]].forEach(([id,f])=>$(id).addEventListener('pointerdown',e=>{ e.preventDefault(); if(st==='play') f(); }));
</script>
