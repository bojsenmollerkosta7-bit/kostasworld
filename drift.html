<script type="module">

  const fm=Math.max(hz[0],hz[1],hz[2]);scene.fog.color.setRGB(hz[0]/fm*.5,hz[1]/fm*.48,hz[2]/fm*.48);scene.fog.density=.0013;hemi.intensity=.12;renderer.toneMappingExposure=.7});
const TL=new THREE.TextureLoader();

// ================= textures =================

const rnd=Math.random;
const asphalt=ctex(1024,1024,(g,w,h)=>{g.fillStyle='#34353a';g.fillRect(0,0,w,h);
  for(let i=0;i<90000;i++){const v=35+rnd()*45|0;g.fillStyle=`rgba(${v},${v},${v+2},${.55*rnd()})`;g.fillRect(rnd()*w,rnd()*h,1+rnd()*2.2,1+rnd()*2.2)}
  for(let i=0;i<30;i++){g.strokeStyle=`rgba(12,12,14,${.2+rnd()*.3})`;g.lineWidth=1+rnd()*2;g.beginPath();let x=rnd()*w,y=rnd()*h;g.moveTo(x,y);for(let k=0;k<8;k++){x+=(rnd()-.5)*50;y+=(rnd()-.5)*50;g.lineTo(x,y)}g.stroke()}},true);
const asphaltR=ctex(512,512,(g,w,h)=>{g.fillStyle='#d0d0d0';g.fillRect(0,0,w,h);for(let i=0;i<20000;i++){const v=150+rnd()*105|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(rnd()*w,rnd()*h,2,2)}
},true,false);
const concrete=ctex(256,256,(g,w,h)=>{g.fillStyle='#a39d95';g.fillRect(0,0,w,h);
  for(let i=0;i<7000;i++){const v=135+rnd()*45|0;g.fillStyle=`rgba(${v},${v-4},${v-9},.45)`;g.fillRect(rnd()*w,rnd()*h,2,2)}
  g.strokeStyle='rgba(70,66,60,.55)';g.lineWidth=2;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke()}},true);
function facadeMat(base,glass,trim){const lit=[];
  const map=ctex(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<4000;i++){g.fillStyle=`rgba(0,0,0,${rnd()*.07})`;g.fillRect(rnd()*w,rnd()*h,3,3)}
    for(let r=0;r<8;r++){g.fillStyle=trim;g.fillRect(0,r*64+56,w,5)}
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){const x=c*64+10,y=r*64+10,on=rnd()<.28;lit.push(on);
      g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x-3,y-3,50,48);
      const gr=g.createLinearGradient(x,y,x+44,y+42);gr.addColorStop(0,glass);gr.addColorStop(.6,'#151b24');gr.addColorStop(1,'#0b0f15');g.fillStyle=gr;g.fillRect(x,y,44,42);
      g.fillStyle='rgba(30,30,30,.9)';g.fillRect(x+21,y,2,42);g.fillStyle='rgba(255,255,255,.15)';g.fillRect(x,y,44,2)}},true);
  let k=0;const em=ctex(512,512,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(lit[k++]){const gr=g.createLinearGradient(0,r*64+10,0,r*64+52);gr.addColorStop(0,rnd()<.5?'#ffcf87':'#ffe6bf');gr.addColorStop(1,'#7a5a30');g.fillStyle=gr;g.fillRect(c*64+10,r*64+10,44,42)}}},true);

const FAC=[['#b6a38e','#4a6680','#8e7f6e'],['#8f9aa6','#3a5670','#6f7984'],['#d3ccbf','#56708a','#aaa292'],['#6d6a73','#33465a','#55525a'],['#a8735b','#3e5a74','#86584a'],['#e2ddd4','#5d7894','#bdb6aa'],['#7d8b7a','#3d566c','#606d5e']].map(a=>facadeMat(...a));
const glassTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#c7d3df';g.fillRect(0,0,w,h);g.fillStyle='#2b333c';
  for(let i=0;i<8;i++)g.fillRect(i*32,0,3,h);for(let i=0;i<4;i++)g.fillRect(0,i*64,w,5);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(255,220,160,${rnd()*.35})`;g.fillRect((rnd()*8|0)*32+3,(rnd()*4|0)*64+5,29,59)}},true);
const glassMat=new THREE.MeshPhysicalMaterial({map:glassTex,color:0x9fb6cc,metalness:.85,roughness:.07,envMapIntensity:1.3,clearcoat:.4});
const shopEm=[];const shopTex=ctex(512,128,(g,w,h)=>{g.fillStyle='#2a2826';g.fillRect(0,0,w,h);
  const signs=['#b8322f','#2f6eb8','#2f8a52','#d69a2b','#7b3fa0','#1f1f1f'];
  for(let i=0;i<4;i++){const x=i*128;g.fillStyle=signs[rnd()*signs.length|0];g.fillRect(x+6,6,116,24);
    g.fillStyle='rgba(255,255,255,.75)';for(let k=0;k<6;k++)g.fillRect(x+20+k*15,14,10,8);
    const gr=g.createLinearGradient(0,36,0,122);gr.addColorStop(0,'#ffe2b0');gr.addColorStop(1,'#8a6a45');g.fillStyle=gr;g.fillRect(x+10,38,108,84);
    g.fillStyle='#1b1a19';g.fillRect(x+62,38,4,84);g.fillRect(x+10,78,108,3)}},true);
const shopEmTex=ctex(512,128,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(let i=0;i<4;i++){g.fillStyle='#ffd9a0';g.fillRect(i*128+10,38,108,84);g.fillStyle='#aaa';g.fillRect(i*128+6,6,116,24)}},true);
const shopMat=new THREE.MeshStandardMaterial({map:shopTex,emissiveMap:shopEmTex,emissive:0xffffff,emissiveIntensity:1.2,roughness:.5,envMapIntensity:.6});
const capMat=new THREE.MeshStandardMaterial({color:0x6b6865,roughness:.9});
const roofBits=new THREE.MeshStandardMaterial({color:0x8d9095,roughness:.55,metalness:.5});

// ================= city layout =================
const GRID=8,ROAD=24,BLOCK=58,CELL=ROAD+BLOCK,TOTAL=GRID*CELL+ROAD,O=-TOTAL/2,HALF=TOTAL/2;
const bStart=i=>O+ROAD+i*CELL, roadC=i=>O+ROAD/2+i*CELL;
const plaza=(i,j)=>(i===3||i===4)&&(j===3||j===4);
const plazaMin=bStart(3),plazaMax=bStart(4)+BLOCK, inPlaza=(x,z)=>x>plazaMin-2&&x<plazaMax+2&&z>plazaMin-2&&z<plazaMax+2;
const blocks=[],solids=[];
const ground=new THREE.Mesh(new THREE.PlaneGeometry(TOTAL+1400,TOTAL+1400),new THREE.MeshStandardMaterial({map:asphalt,roughnessMap:asphaltR,roughness:.95,envMapIntensity:.45}));
asphalt.repeat.set((TOTAL+1400)/14,(TOTAL+1400)/14);asphaltR.repeat.copy(asphalt.repeat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const walkMat=new THREE.MeshStandardMaterial({map:concrete,roughness:.92});concrete.repeat.set(BLOCK/4,BLOCK/4);
photoTex('asphalt_02',new THREE.Vector2((TOTAL+1400)/7,(TOTAL+1400)/7),ground.material,1.2);
const curbMat=new THREE.MeshStandardMaterial({color:0x8c8780,roughness:.85});photoTex('square_concrete_pavers',new THREE.Vector2(BLOCK/2.5,BLOCK/2.5),walkMat,.8);
const merge={};const addG=(key,geo,x,y,z,ry=0)=>{geo.rotateY(ry);geo.translate(x,y,z);(merge[key]=merge[key]||[]).push(geo)};
function scaleUV(geo,w,h,d,uw,vh){const uv=geo.attributes.uv;for(let f=0;f<6;f++){const su=(f<2?d:w)/uw,sv=f===2||f===3?d/uw:h/vh;
  for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv)}}}
for(let i=-1;i<=GRID;i++)for(let j=-1;j<=GRID;j++){
  const outer=i<0||j<0||i>=GRID||j>=GRID,sh=outer?'o':'i';
  if(!outer&&plaza(i,j))continue;
  const x0=bStart(i),z0=bStart(j);
  addG('walk',new THREE.BoxGeometry(BLOCK,.22,BLOCK),x0+BLOCK/2,.11,z0+BLOCK/2);
  addG('curb',new THREE.BoxGeometry(BLOCK+.5,.18,BLOCK+.5),x0+BLOCK/2,.09,z0+BLOCK/2);
  if(!outer)blocks.push({x0,x1:x0+BLOCK,z0,z1:z0+BLOCK});
  const lot=(BLOCK-10)/2;
  const tower=R()<.18;
  if(tower){const w=BLOCK-14-R()*6,d=BLOCK-14-R()*6,h=90+R()*90;const g=new THREE.BoxGeometry(w,h,d);scaleUV(g,w,h,d,32,32);addG('glass'+sh,g,x0+BLOCK/2,h/2+.22,z0+BLOCK/2);
    const pod=new THREE.BoxGeometry(w+4,5,d+4);scaleUV(pod,w+4,5,d+4,16,5);addG('shop'+sh,pod,x0+BLOCK/2,2.72,z0+BLOCK/2);
    addG('cap'+sh,new THREE.BoxGeometry(w+.6,1.2,d+.6),x0+BLOCK/2,h+.82,z0+BLOCK/2);
    if(!outer)addG('bits',new THREE.BoxGeometry(w*.4,4,d*.4),x0+BLOCK/2,h+3,z0+BLOCK/2);

  for(const s of smokes){if(s.life<=0)continue;s.life-=dt*.42;const p=s.m.position;p.x+=s.vx*dt;p.y+=s.vy*dt;p.z+=s.vz*dt;s.vx*=.98;s.vz*=.98;

  // exhaust flames

  CAR.body.rotation.z=THREE.MathUtils.clamp(roll,-.09,.09);CAR.body.rotation.x=THREE.MathUtils.clamp(pitch,-.05,.05);
  CAR.wheels.forEach((w,i)=>w.rotation.x+=(i>=2?wR:u/S.wr)*dt);

  else{let dx=sn,dz=cs;if(sp>4){const vx=car.vx/sp,vz=car.vz/sp;dx=sn*.55+vx*.45;dz=cs*.55+vz*.45;const l=Math.hypot(dx,dz);dx/=l;dz/=l}
    const dist=camMode===1?4.4:camMode===2?11:6.8,hgt=camMode===1?1.55:camMode===2?4.5:2.3;

    camera.position.set(camPos.x+Math.sin(t*37)*sk,camPos.y+Math.sin(t*41)*sk,camPos.z+Math.cos(t*33)*sk);
    camLook.set(car.x+sn*3,.9,car.z+cs*3);camera.lookAt(camLook);camera.fov=56+Math.min(sp,60)*.3}

  sun.position.set(car.x+sunDir.x*300,sunDir.y*300,car.z+sunDir.z*300);sun.target.position.set(car.x,0,car.z);
  // engine audio
  let r2=state==='menu'?900+Math.sin(performance.now()*.002)*40:rpm;
  if(AC&&!muted){const f=r2/60*S.cyl/2,t=AC.currentTime;oscs.forEach(o=>o.frequency.setTargetAtTime(Math.min(1800,f*o.mul*.5),t,.02));
    lp.frequency.setTargetAtTime(350+r2*(inp.up||inp.down&&rev?.5:.22),t,.05);engG.gain.setTargetAtTime(state==='menu'?.04:(inp.up?.12:.07)*(rpm>=S.red?(rnd()<.5?.4:1):1),t,.03);
    scrG.gain.setTargetAtTime(rearSlide||frontSlide||lock?Math.min(.32,.1+Math.abs(slipR)*.35+Math.abs(sigR)*.15):0,t,.05);windG.gain.setTargetAtTime(Math.min(.25,sp*sp*.00008),t,.2)}
  // HUD
  if(state!=='menu'){$('hl').innerHTML=mode==='chal'?`TIME ${Math.ceil(timeLeft)}s`:`FREE DRIVE · ${S.name}`;$('hr').innerHTML=`SCORE ${score}<br><small>BEST DRIFT ${bestDrift}</small>`;
    $('kmh').textContent=Math.round(sp*3.6);$('gear').textContent=rev?'R':gear;
    if(cur>0){$('dpts').textContent=Math.round(cur);$('dmul').textContent='x'+mult+' COMBO · '+Math.round(ang*57)+'° · '+dtime.toFixed(1)+'s'}else{$('dpts').textContent='';$('dmul').textContent=''}}
  else{$('dpts').textContent='';$('dmul').textContent=''}
}
let last=performance.now();
function loop(now){film.uniforms.t.value=now*.001%100;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);composer.render();requestAnimationFrame(loop)}
$('load').remove();$('menu').style.display='flex';
requestAnimationFrame(loop);
window.__game={step(n){for(let i=0;i<n;i++)update(1/60)},get state(){return state},get car(){return car},K,get score(){return score},get cur(){return cur},start,setCar,
  get info(){return {gear,rpm:rpm|0,wR:+wR.toFixed(1),beta:+beta.toFixed(2),sigR:+sigR.toFixed(2)}},setAssist(v){assist=v}};
